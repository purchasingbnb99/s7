<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPENBER - Sistem Penerimaan Berkas & Penyerahan Sample</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f97316'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' fill='%23ffffff' font-family='Arial, sans-serif' font-weight='bold' font-size='65'>S</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    @media print {
      body > *:not(#printArea) { display: none !important; }
      body { background: #ffffff !important; color: #000000 !important; }
      #printArea { display: block !important; position: absolute; left: 0; top: 0; width: 100%; background: #ffffff !important; color: #000000 !important; padding: 20px; }
      table { width: 100%; border-collapse: collapse; margin-top: 15px; }
      th, td { border: 1px solid #000 !important; padding: 8px; text-align: left; font-size: 12px; color: #000 !important; }
      th { background-color: #f2f2f2 !important; font-weight: bold; }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- CONFIGURATION -->
  <script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxf0cuja3sYJA-qdv3mxZV9PeDjZzMd4DbL8oMk82HIqC78G0RydEW_gS1qxsdtLc1p7g/exec";
  </script>

  <!-- TOP HEADER -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-orange-500 flex items-center justify-center font-bold text-xl text-white shadow-lg shadow-orange-500/30">S</div>
        <div>
          <h1 class="font-bold text-lg text-orange-500 tracking-wide">SIPENBER</h1>
          <p class="text-xs text-slate-400 hidden sm:block">Sistem Penerimaan Berkas & Penyerahan Sample</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="toggleLogbookModal()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm transition hidden sm:flex">
          <i class="fa-solid fa-clock-rotate-left text-orange-400"></i>
          <span>Logbook</span>
          <span id="logCountBadge" class="bg-orange-500 text-white text-xs px-2 py-0.5 rounded-full font-semibold">0</span>
        </button>

        <div class="bg-slate-900 p-1 rounded-lg flex gap-1 border border-slate-700">
          <button id="btnRolePenerima" onclick="switchRole('penerima')" class="px-3 py-1 rounded text-xs font-medium transition bg-blue-600 text-white shadow">
            <i class="fa-solid fa-user-check mr-1 hidden sm:inline"></i> Staff
          </button>
          <button id="btnRoleAdmin" onclick="switchRole('admin')" class="px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white transition">
            <i class="fa-solid fa-shield-halved mr-1"></i> Admin
          </button>
        </div>
      </div>
    </div>

    <!-- MODULE TAB NAVIGATION -->
    <div class="bg-slate-900 border-b border-slate-700 px-4 sm:px-6 lg:px-8 flex gap-1 overflow-x-auto">
      <button id="tabBerkas" onclick="switchModule('berkas')" class="py-2.5 px-4 text-xs font-semibold text-orange-400 border-b-2 border-orange-500 flex items-center gap-2 whitespace-nowrap">
        <i class="fa-solid fa-folder-closed"></i> Penerimaan Berkas
      </button>
      <button id="tabSample" onclick="switchModule('sample')" class="py-2.5 px-4 text-xs font-semibold text-slate-400 hover:text-white border-b-2 border-transparent flex items-center gap-2 whitespace-nowrap">
        <i class="fa-solid fa-vial"></i> Penyerahan Sample
      </button>
      <button id="tabPoKembali" onclick="switchModule('pokembali')" class="py-2.5 px-4 text-xs font-semibold text-slate-400 hover:text-white border-b-2 border-transparent flex items-center gap-2 whitespace-nowrap">
        <i class="fa-solid fa-arrow-rotate-left"></i> Catatan PO Kembali
      </button>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col gap-6 no-print">

    <!-- MODULE 1: BERKAS DOKUMEN -->
    <div id="moduleBerkasContainer" class="flex flex-col gap-6">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-slate-800 border border-slate-700/60 p-4 rounded-xl flex items-center justify-between"><div><p class="text-[10px] text-slate-400 font-medium">TOTAL BERKAS</p><h3 id="statTotal" class="text-xl font-bold text-white mt-1">0</h3></div><div class="w-8 h-8 rounded bg-blue-500/10 text-blue-400 flex justify-center items-center"><i class="fa-solid fa-copy"></i></div></div>
        <div class="bg-slate-800 border border-slate-700/60 p-4 rounded-xl flex items-center justify-between"><div><p class="text-[10px] text-slate-400 font-medium">DICEKLIS</p><h3 id="statChecked" class="text-xl font-bold text-emerald-400 mt-1">0</h3></div><div class="w-8 h-8 rounded bg-emerald-500/10 text-emerald-400 flex justify-center items-center"><i class="fa-solid fa-check"></i></div></div>
        <div class="bg-slate-800 border border-slate-700/60 p-4 rounded-xl flex items-center justify-between"><div><p class="text-[10px] text-slate-400 font-medium">TERKUNCI</p><h3 id="statLocked" class="text-xl font-bold text-amber-400 mt-1">0</h3></div><div class="w-8 h-8 rounded bg-amber-500/10 text-amber-400 flex justify-center items-center"><i class="fa-solid fa-lock"></i></div></div>
        <div class="bg-slate-800 border border-slate-700/60 p-4 rounded-xl flex items-center justify-between"><div><p class="text-[10px] text-slate-400 font-medium">TANGGAL</p><h3 id="statDates" class="text-xl font-bold text-purple-400 mt-1">0</h3></div><div class="w-8 h-8 rounded bg-purple-500/10 text-purple-400 flex justify-center items-center"><i class="fa-solid fa-calendar"></i></div></div>
      </div>
      <div class="bg-slate-800 border border-slate-700/60 p-4 rounded-xl flex flex-wrap gap-3 items-center justify-between">
        <div class="flex flex-1 gap-2 min-w-[280px]">
          <div class="relative flex-1"><i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i><input type="text" id="searchInput" oninput="renderTable()" placeholder="Cari No PO..." class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-3 py-2 text-sm text-slate-100 outline-none"></div>
          <select id="filterDate" onchange="renderTable()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 outline-none"><option value="">Semua Tanggal</option></select>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="fetchDocumentsFromBackend()" class="px-3 py-2 rounded-lg bg-slate-700 text-slate-200 text-sm"><i class="fa-solid fa-rotate"></i></button>
          <button id="btnCreateBatch" onclick="openCreateModal()" class="hidden px-4 py-2 rounded-lg bg-orange-600 text-white font-medium text-sm flex items-center gap-2"><i class="fa-solid fa-plus"></i> Buat Penerimaan</button>
        </div>
      </div>
      <div id="groupedTablesContainer" class="flex flex-col gap-6"></div>
    </div>

    <!-- MODULE 2: PENYERAHAN SAMPLE -->
    <div id="moduleSampleContainer" class="hidden flex-col gap-6">
      <div class="bg-slate-800 border border-slate-700/60 p-4 rounded-xl flex flex-wrap gap-3 items-center justify-between">
        <div class="relative flex-1 min-w-[280px]">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="searchSampleInput" oninput="renderSampleTable()" placeholder="Cari Nama Barang/Sample, Tujuan..." class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-3 py-2 text-sm text-slate-100 outline-none focus:border-orange-500">
        </div>
        <div class="flex items-center gap-2">
          <button onclick="fetchSampleFromBackend()" class="px-3 py-2 rounded-lg bg-slate-700 text-slate-200 text-sm"><i class="fa-solid fa-rotate"></i></button>
          <button id="btnCreateSample" onclick="openCreateSampleModal()" class="hidden px-4 py-2 rounded-lg bg-orange-600 text-white font-medium text-sm flex items-center gap-2 shadow-lg"><i class="fa-solid fa-plus"></i> Input Sample</button>
        </div>
      </div>
      <div class="bg-slate-800 border border-slate-700/60 rounded-xl overflow-hidden shadow-xl overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/90 uppercase text-[11px] font-semibold text-slate-400 border-b border-slate-700">
            <tr><th class="py-3 px-4 w-12 text-center">NO</th><th class="py-3 px-4">TANGGAL</th><th class="py-3 px-4">NAMA BARANG</th><th class="py-3 px-4">TUJUAN</th><th class="py-3 px-4">KETERANGAN</th><th class="py-3 px-4 text-center">FOTO</th><th class="py-3 px-4 text-center">AKSI</th></tr>
          </thead>
          <tbody id="sampleTableBody" class="divide-y divide-slate-700/50"></tbody>
        </table>
      </div>
    </div>

    <!-- MODULE 3: CATATAN PO KEMBALI -->
    <div id="modulePoKembaliContainer" class="hidden flex-col gap-5">
      <div class="bg-slate-800 border border-slate-700/60 p-4 rounded-xl flex flex-col lg:flex-row gap-4 justify-between">
        <div class="flex flex-wrap items-center gap-3">
          <select id="filterBulanPo" onchange="fetchPoKembaliFromBackend()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 outline-none font-semibold">
            <option value="01">Jan</option><option value="02">Feb</option><option value="03">Mar</option><option value="04">Apr</option><option value="05">Mei</option><option value="06">Jun</option>
            <option value="07">Jul</option><option value="08">Agu</option><option value="09">Sep</option><option value="10">Okt</option><option value="11">Nov</option><option value="12">Des</option>
          </select>
          <select id="filterTahunPo" onchange="fetchPoKembaliFromBackend()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 outline-none font-semibold">
            <option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option>
          </select>
          <div class="relative w-full sm:w-64">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="searchPoKembaliInput" oninput="renderPoKembaliTable()" placeholder="Cari No PO / Vendor..." class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-3 py-2 text-sm text-slate-100 outline-none">
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button id="btnCreatePoKembali" onclick="openCreatePoKembaliModal()" class="hidden px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm flex items-center gap-2 shadow-lg">
            <i class="fa-solid fa-plus"></i> Input PO Kembali
          </button>
        </div>
      </div>
      <div class="flex gap-2 border-b border-slate-700 pb-2 overflow-x-auto">
        <button onclick="setActiveSubTab('BZO')" id="subTabBZO" class="px-4 py-1.5 rounded-full text-xs font-bold transition bg-emerald-600 text-white whitespace-nowrap">Kelompok BZO</button>
        <button onclick="setActiveSubTab('BBO')" id="subTabBBO" class="px-4 py-1.5 rounded-full text-xs font-bold transition bg-slate-800 text-slate-400 border border-slate-700 hover:text-white whitespace-nowrap">Kelompok BBO</button>
        <button onclick="setActiveSubTab('BWPO')" id="subTabBWPO" class="px-4 py-1.5 rounded-full text-xs font-bold transition bg-slate-800 text-slate-400 border border-slate-700 hover:text-white whitespace-nowrap">Kelompok BWPO</button>
      </div>
      <div id="poKembaliTablesContainer" class="grid grid-cols-1 gap-6"></div>
    </div>
  </main>

  <!-- PRINT AREA -->
  <div id="printArea" class="hidden"></div>

  <!-- SEMUA MODALS -->
  <!-- 1. Password -->
  <div id="modalPassword" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 no-print">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-sm w-full p-6 shadow-2xl text-center">
      <div class="w-12 h-12 rounded-full bg-orange-500/10 text-orange-400 flex items-center justify-center text-xl mx-auto mb-2"><i class="fa-solid fa-lock"></i></div>
      <h3 class="text-lg font-bold text-white">Verifikasi Admin</h3>
      <input type="password" id="inputAdminPassword" placeholder="Password (admin123)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 my-4 outline-none text-center">
      <div class="flex gap-2"><button onclick="closePasswordModal()" class="flex-1 py-2 rounded-lg bg-slate-700 text-slate-300 text-sm">Batal</button><button onclick="submitAdminPassword()" class="flex-1 py-2 rounded-lg bg-orange-600 text-white text-sm">Masuk</button></div>
    </div>
  </div>

  <!-- 2. Create Berkas Batch -->
  <div id="modalCreateBatch" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 no-print">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-2xl w-full p-6 shadow-2xl flex flex-col max-h-[90vh]">
      <div class="flex justify-between border-b border-slate-700 pb-4 mb-4"><h3 class="text-lg font-bold text-white">Buat Form Penerimaan Berkas</h3><button onclick="closeCreateModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button></div>
      <div class="flex-1 overflow-y-auto space-y-3 pr-1" id="batchItemsContainer"></div>
      <div class="pt-4 border-t border-slate-700 flex justify-between mt-4">
        <button onclick="addBatchRow()" class="px-3 py-2 rounded-lg bg-slate-700 text-slate-200 text-xs"><i class="fa-solid fa-plus"></i> Baris</button>
        <div class="flex gap-2"><button onclick="closeCreateModal()" class="px-4 py-2 bg-slate-700 text-slate-300 text-sm rounded-lg">Batal</button><button onclick="saveBatchDocuments()" class="px-4 py-2 bg-orange-600 text-white text-sm rounded-lg">Simpan</button></div>
      </div>
    </div>
  </div>

  <!-- 3. Edit Berkas -->
  <div id="modalEditDoc" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 no-print">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-sm w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-white mb-4 border-b border-slate-700 pb-2">Edit Berkas</h3>
      <input type="hidden" id="editDocId">
      <div class="space-y-3 text-xs">
        <input type="text" id="editTanggal" placeholder="Tanggal" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100">
        <input type="text" id="editNoPo" placeholder="No PO" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100">
        <input type="text" id="editNamaVendor" placeholder="Vendor" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100">
        <input type="number" id="editNominal" placeholder="Nominal" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100">
      </div>
      <div class="mt-4 flex justify-end gap-2"><button onclick="closeEditModal()" class="px-3 py-1.5 rounded-lg bg-slate-700 text-white text-xs">Batal</button><button onclick="submitEditDocument()" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs">Simpan</button></div>
    </div>
  </div>

  <!-- 4. Sample Form -->
  <div id="modalSampleForm" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 no-print">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-lg w-full p-6 shadow-2xl">
      <div class="flex justify-between border-b border-slate-700 pb-3 mb-4"><h3 class="text-lg font-bold text-white"><i class="fa-solid fa-vial text-orange-400"></i> Sample</h3><button onclick="closeSampleModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button></div>
      <input type="hidden" id="sampleEditId">
      <div class="space-y-3 text-xs">
        <input type="date" id="sampleTanggal" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100">
        <input type="text" id="sampleNamaBarang" placeholder="Nama Barang/Sample *" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100">
        <input type="text" id="sampleTujuan" placeholder="Tujuan *" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100">
        <textarea id="sampleKeterangan" rows="2" placeholder="Keterangan..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100"></textarea>
        <div><label class="block text-slate-400 font-medium mb-1">Bukti Foto (Kamera/Galeri)</label><input type="file" id="sampleFotoInput" accept="image/*" capture="environment" class="w-full text-slate-300"></div>
      </div>
      <div class="pt-4 flex justify-end gap-2 mt-5"><button onclick="closeSampleModal()" class="px-4 py-2 rounded-lg bg-slate-700 text-white text-xs">Batal</button><button onclick="saveSampleData()" class="px-4 py-2 rounded-lg bg-orange-600 text-white text-xs font-bold">Simpan</button></div>
    </div>
  </div>

  <!-- 5. PO Kembali Form -->
  <div id="modalPoKembaliForm" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-lg w-full p-6 shadow-2xl">
      <div class="flex justify-between border-b border-slate-700 pb-3 mb-4"><h3 class="text-lg font-bold text-white"><i class="fa-solid fa-arrow-rotate-left text-emerald-400"></i> PO Kembali</h3><button onclick="closePoKembaliModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button></div>
      <input type="hidden" id="poKembaliEditId">
      <div class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <div><label class="block text-slate-400 mb-1">Kirim *</label><input type="date" id="poKembaliTglKirim" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100"></div>
          <div><label class="block text-slate-400 mb-1">Kembali</label><input type="date" id="poKembaliTglKembali" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100"></div>
        </div>
        <div class="grid grid-cols-12 gap-2">
          <div class="col-span-4"><label class="block text-slate-400 mb-1">Prefix *</label>
            <select id="poKembaliPrefix" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-2 text-slate-100 font-mono">
              <optgroup label="BZO"><option>BZOA</option><option>BZOB</option><option>BZOC</option><option>BZOD</option><option>BZOE</option></optgroup>
              <optgroup label="BBO"><option>BBOA</option><option>BBOB</option><option>BBOC</option><option>BBOD</option><option>BBOE</option></optgroup>
              <optgroup label="BWPO"><option>BWPOA</option><option>BWPOB</option><option>BWPOC</option><option>BWPOD</option><option>BWPOE</option></optgroup>
            </select>
          </div>
          <div class="col-span-8"><label class="block text-slate-400 mb-1">No PO *</label><input type="text" id="poKembaliNoPo" placeholder="BZO26A001" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 font-mono"></div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="block text-slate-400 mb-1">Tgl PO</label><input type="date" id="poKembaliTglPo" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100"></div>
          <div><label class="block text-slate-400 mb-1">Vendor *</label><input type="text" id="poKembaliVendor" placeholder="PT..." class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100"></div>
        </div>
        <div><label class="block text-slate-400 mb-1">Catatan</label><textarea id="poKembaliCatatan" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100"></textarea></div>
      </div>
      <div class="pt-4 flex justify-end gap-2 mt-4"><button onclick="closePoKembaliModal()" class="px-4 py-2 rounded-lg bg-slate-700 text-white text-xs">Batal</button><button onclick="savePoKembaliData()" class="px-4 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold">Simpan</button></div>
    </div>
  </div>

  <!-- 6. Logbook -->
  <div id="modalLogbook" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 no-print">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-3xl w-full p-6 shadow-2xl flex flex-col max-h-[85vh]">
      <div class="flex justify-between border-b border-slate-700 pb-4 mb-4"><h3 class="text-lg font-bold text-white"><i class="fa-solid fa-clock-rotate-left text-orange-400"></i> Riwayat Logbook</h3><button onclick="toggleLogbookModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="flex-1 overflow-y-auto border border-slate-700 rounded-lg">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-900 text-slate-400 sticky top-0 border-b border-slate-700"><tr><th class="py-2 px-3">WAKTU</th><th class="py-2 px-3">ROLE</th><th class="py-2 px-3">AKSI</th><th class="py-2 px-3">DETAIL</th></tr></thead>
          <tbody id="logbookTableBody" class="divide-y divide-slate-700/50"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT UTAMA -->
  <script>
    let currentRole = 'penerima';
    let isAdminLoggedIn = false;
    
    let documentsData = [];
    let sampleData = [];
    let poKembaliData = [];
    let logsData = [];

    const LOCAL_KEYS = { DOCS: 'SIPENBER_DOCS', SAMPLE: 'SIPENBER_SAMPLE', PO: 'SIPENBER_PO', LOGS: 'SIPENBER_LOGS', BACKUP: 'SIPENBER_LAST_BACKUP' };
    
    let activePrefixGroup = 'BZO';
    const PREFIX_GROUPS = { 'BZO': ['BZOA', 'BZOB', 'BZOC', 'BZOD', 'BZOE'], 'BBO': ['BBOA', 'BBOB', 'BBOC', 'BBOD', 'BBOE'], 'BWPO': ['BWPOA', 'BWPOB', 'BWPOC', 'BWPOD', 'BWPOE'] };

    window.onload = () => {
      // Set Default Filter PO Kembali
      const now = new Date();
      document.getElementById('filterBulanPo').value = ('0' + (now.getMonth() + 1)).slice(-2);
      document.getElementById('filterTahunPo').value = now.getFullYear();

      loadLocalData();
      if (GAS_API_URL && !GAS_API_URL.includes("ISI_") && !GAS_API_URL.includes("CONTOH_URL")) {
        fetchDocumentsFromBackend(); fetchSampleFromBackend(); fetchLogsFromBackend(); fetchPoKembaliFromBackend();
      }
      renderTable(); renderSampleTable(); renderPoKembaliTable(); updateLogCountBadge();
    };

    // --- NAVIGATION & ROLE ---
    function switchModule(mod) {
      document.getElementById('moduleBerkasContainer').classList.toggle('hidden', mod !== 'berkas');
      document.getElementById('moduleSampleContainer').classList.toggle('hidden', mod !== 'sample');
      document.getElementById('modulePoKembaliContainer').classList.toggle('hidden', mod !== 'pokembali');
      
      const activeClass = "py-2.5 px-4 text-xs font-semibold whitespace-nowrap flex items-center gap-2 border-b-2 ";
      const inactiveClass = "py-2.5 px-4 text-xs font-semibold text-slate-400 hover:text-white border-b-2 border-transparent flex items-center gap-2 whitespace-nowrap";
      
      document.getElementById('tabBerkas').className = mod === 'berkas' ? activeClass + "text-orange-400 border-orange-500" : inactiveClass;
      document.getElementById('tabSample').className = mod === 'sample' ? activeClass + "text-orange-400 border-orange-500" : inactiveClass;
      document.getElementById('tabPoKembali').className = mod === 'pokembali' ? activeClass + "text-emerald-400 border-emerald-500" : inactiveClass;
    }

    function switchRole(role) {
      if (role === 'admin' && !isAdminLoggedIn) { openPasswordModal(); return; }
      if (role !== 'admin') isAdminLoggedIn = false;
      setRoleState(role);
    }

    function setRoleState(role) {
      currentRole = role;
      const isAdmin = role === 'admin';
      document.getElementById('roleLabel').innerText = isAdmin ? 'Admin' : 'Staff';
      document.getElementById('btnRolePenerima').className = !isAdmin ? 'px-3 py-1 rounded text-xs font-medium bg-blue-600 text-white' : 'px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white';
      document.getElementById('btnRoleAdmin').className = isAdmin ? 'px-3 py-1 rounded text-xs font-medium bg-orange-600 text-white' : 'px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white';
      document.getElementById('btnCreateBatch').classList.toggle('hidden', !isAdmin);
      document.getElementById('btnCreateSample').classList.toggle('hidden', !isAdmin);
      document.getElementById('btnCreatePoKembali').classList.toggle('hidden', !isAdmin);
      
      renderTable(); renderSampleTable(); renderPoKembaliTable();
      if (isAdmin) checkYearlyBackup();
    }

    function openPasswordModal() { document.getElementById('inputAdminPassword').value = ''; document.getElementById('modalPassword').classList.remove('hidden'); }
    function closePasswordModal() { document.getElementById('modalPassword').classList.add('hidden'); }
    function submitAdminPassword() {
      const pass = document.getElementById('inputAdminPassword').value;
      if(pass === 'admin123' || pass === 'admin') { 
        isAdminLoggedIn = true; closePasswordModal(); setRoleState('admin'); showToast('Berhasil Login Admin', 'success');
      } else { showToast('Password Salah', 'error'); }
    }

    // --- AUTO BACKUP LOGIC ---
    function checkYearlyBackup() {
      let lastBackup = localStorage.getItem(LOCAL_KEYS.BACKUP) || '2025-01-01'; 
      let diffDays = Math.ceil(Math.abs(new Date() - new Date(lastBackup)) / (1000 * 60 * 60 * 24)); 
      if (diffDays >= 365) {
        Swal.fire({
          title: 'Wajib Backup & Bersihkan Data!',
          html: `<div class="text-sm text-slate-300 mb-3">Sistem mendeteksi data PO sudah berumur > 1 tahun.</div><div class="bg-slate-900 p-3 rounded text-left text-xs text-emerald-400 font-mono">1. Membuat arsip CSV di GDrive 'Purchasing'<br>2. Data lama di web dihapus otomatis</div>`,
          icon: 'warning', background: '#1e293b', color: '#fff', allowOutsideClick: false, allowEscapeKey: false,
          confirmButtonColor: '#059669', confirmButtonText: '<i class="fa-solid fa-cloud-arrow-down"></i> Eksekusi Sekarang'
        }).then((r) => { if (r.isConfirmed) executeYearlyBackup(); });
      }
    }

    function executeYearlyBackup() {
      Swal.fire({ title: 'Memproses...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'executeYearlyBackup' }) })
      .then(res => res.json()).then(res => {
        if (res.success) {
          localStorage.setItem(LOCAL_KEYS.BACKUP, new Date().toISOString().split('T')[0]);
          Swal.fire({ icon: 'success', title: 'Selesai!', html: `File tersedia di Drive.<br><a href="${res.downloadUrl}" target="_blank" class="px-3 py-1.5 bg-blue-600 rounded text-white text-xs mt-2 inline-block">Download Copy Lokal</a>`, background: '#1e293b', color: '#fff' });
          fetchPoKembaliFromBackend();
        }
      });
    }

    // --- UTILITIES ---
    function compressImage(file, maxWidth = 600, quality = 0.4) {
      return new Promise((resolve) => {
        const r = new FileReader(); r.readAsDataURL(file);
        r.onload = e => {
          const img = new Image(); img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
        };
      });
    }
    function formatDateString(str) { if(!str || !str.includes('-')) return str; const p = str.split('T')[0].split('-'); return `${p[2]}/${p[1]}/${p[0]}`; }
    function reverseFormat(str) { if(!str || !str.includes('/')) return str; const p = str.split('/'); return `${p[2]}-${p[1]}-${p[0]}`; }
    function showToast(msg, icon='info') { Swal.mixin({toast: true, position: 'bottom-end', showConfirmButton: false, timer: 2000}).fire({icon, title: msg}); }
    
    function saveLocal() {
      localStorage.setItem(LOCAL_KEYS.DOCS, JSON.stringify(documentsData));
      localStorage.setItem(LOCAL_KEYS.SAMPLE, JSON.stringify(sampleData));
      localStorage.setItem(LOCAL_KEYS.PO, JSON.stringify(poKembaliData));
      localStorage.setItem(LOCAL_KEYS.LOGS, JSON.stringify(logsData));
    }
    function loadLocalData() {
      try { documentsData = JSON.parse(localStorage.getItem(LOCAL_KEYS.DOCS)) || []; } catch(e){}
      try { sampleData = JSON.parse(localStorage.getItem(LOCAL_KEYS.SAMPLE)) || []; } catch(e){}
      try { poKembaliData = JSON.parse(localStorage.getItem(LOCAL_KEYS.PO)) || []; } catch(e){}
      try { logsData = JSON.parse(localStorage.getItem(LOCAL_KEYS.LOGS)) || []; } catch(e){}
    }

    // --- MODULE 1: BERKAS ---
    function fetchDocumentsFromBackend() {
      if(!GAS_API_URL.includes("ISI_") && !GAS_API_URL.includes("CONTOH_URL")) fetch(`${GAS_API_URL}?action=getBerkas`).then(r=>r.json()).then(d=>{ documentsData=d; saveLocal(); renderTable(); });
    }
    function renderTable() {
      const container = document.getElementById('groupedTablesContainer');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const filterDate = document.getElementById('filterDate').value;
      container.innerHTML = '';
      
      const opts = [...new Set(documentsData.map(d=>d.tanggal))].filter(Boolean);
      document.getElementById('filterDate').innerHTML = '<option value="">Semua Tanggal</option>' + opts.map(d=>`<option value="${d}" ${d===filterDate?'selected':''}>${d}</option>`).join('');

      const filtered = documentsData.filter(d => (!searchVal || (d.noPo||'').toLowerCase().includes(searchVal)) && (!filterDate || d.tanggal === filterDate));
      
      document.getElementById('statTotal').innerText = documentsData.length;
      document.getElementById('statChecked').innerText = documentsData.filter(d=>d.isChecked).length;
      document.getElementById('statLocked').innerText = documentsData.filter(d=>d.isLocked).length;
      document.getElementById('statDates').innerText = opts.length;

      const groups = {}; filtered.forEach(d => { (groups[d.tanggal || '-'] = groups[d.tanggal || '-'] || []).push(d); });

      Object.keys(groups).forEach(date => {
        const docs = groups[date];
        const card = document.createElement('div'); card.className = 'bg-slate-800 border border-slate-700/60 rounded-xl overflow-hidden shadow';
        let rows = docs.map((d,i) => `
          <tr class="border-b border-slate-700/50 hover:bg-slate-700/30">
            <td class="py-2.5 px-3 text-center text-xs text-slate-500">${i+1}</td>
            <td class="py-2.5 px-3 font-mono font-bold text-orange-400">${d.noPo}</td>
            <td class="py-2.5 px-3 text-slate-200 text-xs">${d.vendor}</td>
            <td class="py-2.5 px-3 font-mono text-emerald-400 text-xs">${d.nominal}</td>
            <td class="py-2.5 px-3"><input type="text" value="${d.notes||''}" onblur="updateDocNote('${d.id}', this.value)" ${d.isLocked && currentRole!=='admin' ? 'disabled' : ''} class="w-full bg-slate-900/50 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 outline-none"></td>
            <td class="py-2.5 px-3 text-center"><input type="checkbox" ${d.isChecked?'checked':''} onchange="toggleDocCheck('${d.id}', this.checked)" ${d.isLocked && currentRole!=='admin' ? 'disabled' : ''} class="w-4 h-4 accent-orange-500"></td>
            <td class="py-2.5 px-3 text-center text-xs">
              ${currentRole==='admin' ? `<button onclick="openEditModal('${d.id}')" class="text-blue-400 mx-1"><i class="fa-solid fa-pen"></i></button><button onclick="deleteDoc('${d.id}')" class="text-red-400 mx-1"><i class="fa-solid fa-trash"></i></button>` : (d.isLocked ? '<i class="fa-solid fa-lock text-amber-500"></i>' : '-')}
            </td>
          </tr>
        `).join('');
        card.innerHTML = `<div class="bg-slate-900/80 px-4 py-3 flex justify-between border-b border-slate-700"><h3 class="font-bold text-white">${date} <span class="text-xs bg-slate-700 px-2 rounded-full ml-2">${docs.length} Berkas</span></h3><button onclick="printReceipt('${date}')" class="text-xs bg-blue-600 px-3 py-1 rounded text-white"><i class="fa-solid fa-print"></i> Cetak</button></div><div class="overflow-x-auto"><table class="w-full text-left"><thead class="bg-slate-900/40 text-slate-400 text-[11px] uppercase"><tr><th class="py-2 px-3 text-center">No</th><th class="py-2 px-3">No PO</th><th class="py-2 px-3">Vendor</th><th class="py-2 px-3">Nominal</th><th class="py-2 px-3">Catatan</th><th class="py-2 px-3 text-center">Ceklis</th><th class="py-2 px-3 text-center">Aksi</th></tr></thead><tbody class="text-xs divide-y divide-slate-700/50">${rows}</tbody></table></div>`;
        container.appendChild(card);
      });
    }

    function openCreateModal() { document.getElementById('batchItemsContainer').innerHTML = ''; addBatchRow(); document.getElementById('modalCreateBatch').classList.remove('hidden'); }
    function closeCreateModal() { document.getElementById('modalCreateBatch').classList.add('hidden'); }
    function addBatchRow() {
      const d = document.createElement('div'); d.className = 'batch-row grid grid-cols-12 gap-2 p-2 bg-slate-900 rounded border border-slate-700';
      d.innerHTML = `<div class="col-span-3"><input type="date" value="${new Date().toISOString().split('T')[0]}" class="i-tgl w-full bg-slate-800 rounded px-2 py-1 text-xs text-white"></div><div class="col-span-3"><input type="text" placeholder="PO" class="i-po w-full bg-slate-800 rounded px-2 py-1 text-xs text-white"></div><div class="col-span-3"><input type="text" placeholder="Vendor" class="i-vnd w-full bg-slate-800 rounded px-2 py-1 text-xs text-white"></div><div class="col-span-2"><input type="number" placeholder="Nominal" class="i-nom w-full bg-slate-800 rounded px-2 py-1 text-xs text-white"></div><div class="col-span-1 flex items-center justify-center"><button onclick="this.parentElement.parentElement.remove()" class="text-red-400"><i class="fa-solid fa-trash"></i></button></div>`;
      document.getElementById('batchItemsContainer').appendChild(d);
    }
    function saveBatchDocuments() {
      const items = [];
      document.querySelectorAll('.batch-row').forEach(r => {
        const t = r.querySelector('.i-tgl').value, p = r.querySelector('.i-po').value, v = r.querySelector('.i-vnd').value;
        if(t && p && v) items.push({ id:'DOC-'+Date.now()+Math.random(), tanggal:formatDateString(t), noPo:p, namaVendor:v, nominal:r.querySelector('.i-nom').value||0 });
      });
      if(items.length===0) return;
      documentsData = [...items, ...documentsData]; saveLocal(); renderTable(); closeCreateModal();
      if(!GAS_API_URL.includes("ISI_") && !GAS_API_URL.includes("CONTOH_URL")) fetch(GAS_API_URL, {method:'POST', body:JSON.stringify({action:'createBerkasBatch', items})});
    }
    
    function toggleDocCheck(id, isChecked) {
      const d = documentsData.find(x=>x.id===id); if(!d) return; d.isChecked = isChecked; if(isChecked) d.isLocked = true; saveLocal(); renderTable();
      if(!GAS_API_URL.includes("ISI_") && !GAS_API_URL.includes("CONTOH_URL")) fetch(GAS_API_URL, {method:'POST', body:JSON.stringify({action:'updatePenerimaStatus', id:d.id, isCompleted:isChecked, notes:d.notes})});
    }
    function updateDocNote(id, note) {
      const d = documentsData.find(x=>x.id===id); if(d){ d.notes=note; saveLocal(); if(!GAS_API_URL.includes("ISI_") && !GAS_API_URL.includes("CONTOH_URL")) fetch(GAS_API_URL, {method:'POST', body:JSON.stringify({action:'updatePenerimaStatus', id:d.id, isCompleted:d.isChecked, notes:note})});}
    }
    function deleteDoc(id) { documentsData = documentsData.filter(d=>d.id!==id); saveLocal(); renderTable(); if(!GAS_API_URL.includes("ISI_") && !GAS_API_URL.includes("CONTOH_URL")) fetch(GAS_API_URL, {method:'POST', body:JSON.stringify({action:'deleteDocument', id})}); }
    
    function openEditModal(id) { const d = documentsData.find(x=>x.id===id); if(d) { document.getElementById('editDocId').value=d.id; document.getElementById('editTanggal').value=d.tanggal; document.getElementById('editNoPo').value=d.noPo; document.getElementById('editNamaVendor').value=d.vendor; document.getElementById('editNominal').value=d.nominal; document.getElementById('modalEditDoc').classList.remove('hidden'); } }
    function closeEditModal() { document.getElementById('modalEditDoc').classList.add('hidden'); }
    function submitEditDocument() {
      const id = document.getElementById('editDocId').value, d = documentsData.find(x=>x.id===id);
      if(d) { d.tanggal=document.getElementById('editTanggal').value; d.noPo=document.getElementById('editNoPo').value; d.vendor=document.getElementById('editNamaVendor').value; d.nominal=document.getElementById('editNominal').value; saveLocal(); renderTable(); closeEditModal(); if(!GAS_API_URL.includes("ISI_") && !GAS_API_URL.includes("CONTOH_URL")) fetch(GAS_API_URL, {method:'POST', body:JSON.stringify({action:'updateDocumentDetails', id:d.id, tanggal:d.tanggal, noPo:d.noPo, namaVendor:d.vendor, nominal:d.nominal})}); }
    }
    function printReceipt(date) {
      const docs = documentsData.filter(d => d.tanggal === date); if (docs.length === 0) return;
      document.getElementById('printArea').innerHTML = `<div style="font-family:Arial;color:#000;background:#fff;padding:20px"><h2>TANDA TERIMA - ${date}</h2><table border="1" width="100%" style="border-collapse:collapse;margin-top:10px"><tr><th>No</th><th>No PO</th><th>Vendor</th><th>Ceklis</th></tr>${docs.map((d,i)=>`<tr><td align="center">${i+1}</td><td>${d.noPo}</td><td>${d.vendor}</td><td align="center">${d.isChecked?'V':''}</td></tr>`).join('')}</table></div>`;
      document.getElementById('printArea').classList.remove('hidden'); window.print(); document.getElementById('printArea').classList.add('hidden');
    }

    // --- MODULE 2: SAMPLE ---
    function fetchSampleFromBackend() { if(!GAS_API_URL.includes("ISI_") && !GAS_API_URL.includes("CONTOH_URL")) fetch(`${GAS_API_URL}?action=getSample`).then(r=>r.json()).then(d=>{ sampleData=d; saveLocal(); renderSampleTable(); }); }
    function renderSampleTable() {
      const src = document.getElementById('searchSampleInput').value.toLowerCase();
      document.getElementById('sampleTableBody').innerHTML = sampleData.filter(s=>!src || s.namaBarang.toLowerCase().includes(src)).map((s,i) => `
        <tr class="hover:bg-slate-700/30 border-b border-slate-700/50 text-xs">
          <td class="py-3 px-4 text-center">${i+1}</td><td class="py-3 px-4">${s.tanggal}</td><td class="py-3 px-4 font-bold text-orange-400">${s.namaBarang}</td><td class="py-3 px-4">${s.tujuan}</td><td class="py-3 px-4 truncate max-w-[150px]">${s.keterangan}</td>
          <td class="py-3 px-4 text-center">${s.urlFoto ? `<button onclick="Swal.fire({imageUrl:'${s.urlFoto}', imageAlt:'Foto', background:'#1e293b'})" class="px-2 py-1 bg-emerald-600 rounded text-white"><i class="fa-solid fa-image"></i></button>` : '-'}</td>
          <td class="py-3 px-4 text-center">${currentRole==='admin' ? `<button onclick="openEditSampleModal('${s.id}')" class="text-blue-400 mx-1"><i class="fa-solid fa-pen"></i></button><button onclick="deleteSample('${s.id}')" class="text-red-400 mx-1"><i class="fa-solid fa-trash"></i></button>` : '-'}</td>
        </tr>
      `).join('') || `<tr><td colspan="7" class="text-center py-6 text-slate-500">Tidak ada data</td></tr>`;
    }
    function openCreateSampleModal() { document.getElementById('sampleEditId').value=''; document.getElementById('sampleTanggal').value=new Date().toISOString().split('T')[0]; document.getElementById('sampleNamaBarang').value=''; document.getElementById('sampleTujuan').value=''; document.getElementById('sampleKeterangan').value=''; document.getElementById('sampleFotoInput').value=''; document.getElementById('modalSampleForm').classList.remove('hidden'); }
    function openEditSampleModal(id) { const s = sampleData.find(x=>x.id===id); if(s) { document.getElementById('sampleEditId').value=s.id; document.getElementById('sampleTanggal').value=reverseFormat(s.tanggal); document.getElementById('sampleNamaBarang').value=s.namaBarang; document.getElementById('sampleTujuan').value=s.tujuan; document.getElementById('sampleKeterangan').value=s.keterangan; document.getElementById('modalSampleForm').classList.remove('hidden'); } }
    function closeSampleModal() { document.getElementById('modalSampleForm').classList.add('hidden'); }
    async function saveSampleData() {
      const id = document.getElementById('sampleEditId').value, fInput = document.getElementById('sampleFotoInput');
      let b64 = ''; if(fInput.files[0]) b64 = await compressImage(fInput.files[0]); else if(id) b64 = sampleData.find(x=>x.id===id)?.urlFoto||'';
      const payload = { action: id?'updateSample':'createSample', id: id||'SMP-'+Date.now(), tanggal: formatDateString(document.getElementById('sampleTanggal').value), namaBarang: document.getElementById('sampleNamaBarang').value, tujuan: document.getElementById('sampleTujuan').value, keterangan: document.getElementById('sampleKeterangan').value, urlFoto: b64 };
      if(id) sampleData[sampleData.findIndex(x=>x.id===id)] = payload; else sampleData.unshift(payload);
      saveLocal(); renderSampleTable(); closeSampleModal(); showToast('Tersimpan', 'success');
      if(!GAS_API_URL.includes("ISI_") && !GAS_API_URL.includes("CONTOH_URL")) fetch(GAS_API_URL, {method:'POST', body:JSON.stringify(payload)});
    }
    function deleteSample(id) { sampleData = sampleData.filter(s=>s.id!==id); saveLocal(); renderSampleTable(); if(!GAS_API_URL.includes("ISI_") && !GAS_API_URL.includes("CONTOH_URL")) fetch(GAS_API_URL, {method:'POST', body:JSON.stringify({action:'deleteSample', id})}); }

    // --- MODULE 3: PO KEMBALI ---
    function fetchPoKembaliFromBackend() {
      const m = document.getElementById('filterBulanPo').value, y = document.getElementById('filterTahunPo').value;
      if(!GAS_API_URL.includes("ISI_") && !GAS_API_URL.includes("CONTOH_URL")) fetch(`${GAS_API_URL}?action=getPoKembali&month=${m}&year=${y}`).then(r=>r.json()).then(d=>{ poKembaliData=d; saveLocal(); renderPoKembaliTable(); });
    }
    function setActiveSubTab(grp) {
      activePrefixGroup = grp;
      ['BZO', 'BBO', 'BWPO'].forEach(g => { document.getElementById('subTab'+g).className = g===grp ? 'px-4 py-1.5 rounded-full text-xs font-bold bg-emerald-600 text-white whitespace-nowrap' : 'px-4 py-1.5 rounded-full text-xs font-bold bg-slate-800 text-slate-400 border border-slate-700 whitespace-nowrap'; });
      renderPoKembaliTable();
    }
    function renderPoKembaliTable() {
      const cont = document.getElementById('poKembaliTablesContainer'); cont.innerHTML = '';
      const searchVal = document.getElementById('searchPoKembaliInput').value.toLowerCase();
      
      PREFIX_GROUPS[activePrefixGroup].forEach(prefix => {
        const items = poKembaliData.filter(p => (p.kodePrefix||'').toUpperCase() === prefix && (!searchVal || p.noPo.toLowerCase().includes(searchVal) || p.namaVendor.toLowerCase().includes(searchVal)));
        const c = document.createElement('div'); c.className = 'bg-slate-800 border border-slate-700 rounded-xl overflow-hidden';
        c.innerHTML = `<div class="bg-emerald-900/30 px-4 py-2 border-b border-slate-700 flex justify-between"><h4 class="font-bold text-emerald-400">${prefix}</h4><span class="text-xs bg-slate-900 px-2 rounded-full">${items.length} Data</span></div><div class="overflow-x-auto"><table class="w-full text-left text-xs"><thead class="bg-slate-900/50 text-slate-400 uppercase text-[10px]"><tr><th class="p-2">No</th><th class="p-2">Kirim</th><th class="p-2">Kembali</th><th class="p-2">No PO</th><th class="p-2">Tgl PO</th><th class="p-2">Vendor</th><th class="p-2">Catatan</th><th class="p-2 text-center">Aksi</th></tr></thead><tbody class="divide-y divide-slate-700/50">${items.length===0?'<tr><td colspan="8" class="text-center py-4 text-slate-500">Kosong</td></tr>' : items.map((p,i)=>`<tr class="hover:bg-slate-700/40"><td class="p-2 text-center">${i+1}</td><td class="p-2 text-emerald-400">${formatDateString(p.tglKirim)}</td><td class="p-2 text-amber-400">${formatDateString(p.tglKembali)}</td><td class="p-2 font-bold text-orange-400">${p.noPo}</td><td class="p-2 text-slate-300">${formatDateString(p.tglPo)}</td><td class="p-2">${p.namaVendor}</td><td class="p-2 truncate max-w-[100px]">${p.catatan||''}</td><td class="p-2 text-center">${currentRole==='admin'?`<button onclick="openEditPoModal('${p.id}')" class="text-blue-400 mx-1"><i class="fa-solid fa-pen"></i></button><button onclick="deletePoKembali('${p.id}')" class="text-red-400 mx-1"><i class="fa-solid fa-trash"></i></button>`:'-'}</td></tr>`).join('')}</tbody></table></div>`;
        cont.appendChild(c);
      });
    }
    function openCreatePoKembaliModal() { document.getElementById('poKembaliEditId').value=''; document.getElementById('poKembaliTglKirim').value=new Date().toISOString().split('T')[0]; document.getElementById('poKembaliTglKembali').value=''; document.getElementById('poKembaliPrefix').value='BZOA'; document.getElementById('poKembaliNoPo').value=''; document.getElementById('poKembaliTglPo').value=''; document.getElementById('poKembaliVendor').value=''; document.getElementById('poKembaliCatatan').value=''; document.getElementById('modalPoKembaliForm').classList.remove('hidden'); }
    function openEditPoModal(id) { const p = poKembaliData.find(x=>x.id===id); if(p) { document.getElementById('poKembaliEditId').value=p.id; document.getElementById('poKembaliTglKirim').value=reverseFormat(p.tglKirim); document.getElementById('poKembaliTglKembali').value=reverseFormat(p.tglKembali); document.getElementById('poKembaliPrefix').value=p.kodePrefix; document.getElementById('poKembaliNoPo').value=p.noPo; document.getElementById('poKembaliTglPo').value=reverseFormat(p.tglPo); document.getElementById('poKembaliVendor').value=p.namaVendor; document.getElementById('poKembaliCatatan').value=p.catatan; document.getElementById('modalPoKembaliForm').classList.remove('hidden'); } }
    function closePoKembaliModal() { document.getElementById('modalPoKembaliForm').classList.add('hidden'); }
    function savePoKembaliData() {
      const id = document.getElementById('poKembaliEditId').value;
      const payload = { action: id?'updatePoKembali':'createPoKembali', id: id||'POK-'+Date.now(), tglKirim: document.getElementById('poKembaliTglKirim').value, tglKembali: document.getElementById('poKembaliTglKembali').value, kodePrefix: document.getElementById('poKembaliPrefix').value, noPo: document.getElementById('poKembaliNoPo').value, tglPo: document.getElementById('poKembaliTglPo').value, namaVendor: document.getElementById('poKembaliVendor').value, catatan: document.getElementById('poKembaliCatatan').value };
      if(id) poKembaliData[poKembaliData.findIndex(x=>x.id===id)] = payload; else poKembaliData.unshift(payload);
      saveLocal(); renderPoKembaliTable(); closePoKembaliModal(); showToast('Tersimpan', 'success');
      if(!GAS_API_URL.includes("ISI_") && !GAS_API_URL.includes("CONTOH_URL")) fetch(GAS_API_URL, {method:'POST', body:JSON.stringify(payload)});
    }
    function deletePoKembali(id) { poKembaliData = poKembaliData.filter(p=>p.id!==id); saveLocal(); renderPoKembaliTable(); if(!GAS_API_URL.includes("ISI_") && !GAS_API_URL.includes("CONTOH_URL")) fetch(GAS_API_URL, {method:'POST', body:JSON.stringify({action:'deletePoKembali', id})}); }

    // --- LOGBOOK ---
    function fetchLogsFromBackend() { if(!GAS_API_URL.includes("ISI_") && !GAS_API_URL.includes("CONTOH_URL")) fetch(`${GAS_API_URL}?action=getLogs`).then(r=>r.json()).then(d=>{ logsData=d; saveLocal(); updateLogCountBadge(); }); }
    function addLog(action, details) {
      const log = { id: 'LOG-'+Date.now(), timestamp: new Date().toLocaleString('id-ID'), role: currentRole, action, details };
      logsData.unshift(log); saveLocal(); updateLogCountBadge(); if(!GAS_API_URL.includes("ISI_") && !GAS_API_URL.includes("CONTOH_URL")) fetch(GAS_API_URL, {method:'POST', body:JSON.stringify({action:'addLogbookEntry', logData:log})});
    }
    function toggleLogbookModal() {
      const m = document.getElementById('modalLogbook'); m.classList.toggle('hidden');
      if(!m.classList.contains('hidden')) document.getElementById('logbookTableBody').innerHTML = logsData.map(l=>`<tr><td class="py-2 px-3">${l.timestamp}</td><td class="py-2 px-3">${l.role}</td><td class="py-2 px-3">${l.action}</td><td class="py-2 px-3">${l.details}</td></tr>`).join('');
    }
    function updateLogCountBadge() { document.getElementById('logCountBadge').innerText = logsData.length; }
  </script>
</body>
</html>
