<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPENBER - Sistem Penerimaan Berkas & Penyerahan Sample</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxf0cuja3sYJA-qdv3mxZV9PeDjZzMd4DbL8oMk82HIqC78G0RydEW_gS1qxsdtLc1p7g/exec";
  </script>

  <!-- HEADER -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-orange-500 flex items-center justify-center font-bold text-xl text-white shadow-lg">S</div>
        <div>
          <h1 class="font-bold text-lg text-orange-500 tracking-wide leading-none">SIPENBER</h1>
          <p class="text-[10px] text-slate-400 mt-1">Sistem Penerimaan Berkas & Penyerahan Sample</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700 text-xs flex items-center gap-2">
          <span class="text-slate-400">Akses:</span>
          <span id="roleBadge" class="text-emerald-400 font-bold flex items-center gap-1"><i class="fa-solid fa-user-check"></i> Staff / Penerima</span>
        </div>

        <div class="bg-slate-900 p-1 rounded-lg flex gap-1 border border-slate-700">
          <button id="btnRolePenerima" onclick="switchRole('penerima')" class="px-3 py-1 rounded text-xs font-medium bg-blue-600 text-white shadow"><i class="fa-solid fa-user"></i> Staff / Penerima</button>
          <button id="btnRoleAdmin" onclick="switchRole('admin')" class="px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white transition"><i class="fa-solid fa-user-shield"></i> Admin</button>
        </div>

        <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-700">
          <div id="dbIndicator" class="w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]"></div>
          <span id="dbText" class="text-[10px] font-bold uppercase text-green-500 tracking-wider">CONNECTED</span>
        </div>
      </div>
    </div>

    <!-- TABS NAVIGATION -->
    <div class="bg-slate-900 border-b border-slate-700 px-4 flex gap-1 overflow-x-auto">
      <button onclick="switchModule('berkas')" id="tabBerkas" class="py-2.5 px-4 text-xs font-semibold text-orange-400 border-b-2 border-orange-500 flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-folder-closed"></i> Penerimaan Berkas PO</button>
      <button onclick="switchModule('sample')" id="tabSample" class="py-2.5 px-4 text-xs font-semibold text-slate-400 hover:text-white border-b-2 border-transparent flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-vial"></i> Penyerahan Sample</button>
      <button onclick="switchModule('pokembali')" id="tabPoKembali" class="py-2.5 px-4 text-xs font-semibold text-slate-400 hover:text-white border-b-2 border-transparent flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-arrow-rotate-left"></i> Catatan PO Kembali</button>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col gap-6">
    <!-- MODULE 1: BERKAS -->
    <div id="moduleBerkasContainer" class="flex flex-col gap-6">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl"><div><p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Total Berkas</p><h3 id="statTotal" class="text-2xl font-bold text-white mt-1">0</h3></div></div>
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl"><div><p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Diceklis</p><h3 id="statChecked" class="text-2xl font-bold text-emerald-400 mt-1">0</h3></div></div>
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl"><div><p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Terkunci</p><h3 id="statLocked" class="text-2xl font-bold text-amber-400 mt-1">0</h3></div></div>
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl"><div><p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Total Tanggal</p><h3 id="statDates" class="text-2xl font-bold text-purple-400 mt-1">0</h3></div></div>
      </div>
      <div id="groupedTablesContainer" class="flex flex-col gap-6">
        <p class="text-slate-500 text-center py-10">Memuat data dari database...</p>
      </div>
    </div>

    <!-- MODULE 2: SAMPLE -->
    <div id="moduleSampleContainer" class="hidden flex-col gap-6">
      <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl p-5">
        <h3 class="font-bold text-white text-base mb-4 flex items-center gap-2"><i class="fa-solid fa-vial text-orange-400"></i> Data Penyerahan Sample</h3>
        <div id="sampleTableContent" class="overflow-x-auto">
          <p class="text-slate-500 text-center py-6">Memuat data sample...</p>
        </div>
      </div>
    </div>

    <!-- MODULE 3: PO KEMBALI -->
    <div id="modulePoKembaliContainer" class="hidden flex-col gap-6">
      <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl p-5">
        <h3 class="font-bold text-white text-base mb-4 flex items-center gap-2"><i class="fa-solid fa-arrow-rotate-left text-emerald-400"></i> Data Catatan PO Kembali</h3>
        <div id="poKembaliTableContent" class="overflow-x-auto">
          <p class="text-slate-500 text-center py-6">Memuat data PO Kembali...</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    let documentsData = [];
    let sampleData = [];
    let poKembaliData = [];
    let currentRole = 'penerima';

    window.onload = () => { loadBerkasData(); };

    function switchModule(mod) {
      document.getElementById('moduleBerkasContainer').classList.toggle('hidden', mod !== 'berkas');
      document.getElementById('moduleSampleContainer').classList.toggle('hidden', mod !== 'sample');
      document.getElementById('modulePoKembaliContainer').classList.toggle('hidden', mod !== 'pokembali');

      const tabB = document.getElementById('tabBerkas');
      const tabS = document.getElementById('tabSample');
      const tabP = document.getElementById('tabPoKembali');

      tabB.className = mod === 'berkas' ? "py-2.5 px-4 text-xs font-semibold text-orange-400 border-b-2 border-orange-500 flex items-center gap-2 whitespace-nowrap" : "py-2.5 px-4 text-xs font-semibold text-slate-400 hover:text-white border-b-2 border-transparent flex items-center gap-2 whitespace-nowrap";
      tabS.className = mod === 'sample' ? "py-2.5 px-4 text-xs font-semibold text-orange-400 border-b-2 border-orange-500 flex items-center gap-2 whitespace-nowrap" : "py-2.5 px-4 text-xs font-semibold text-slate-400 hover:text-white border-b-2 border-transparent flex items-center gap-2 whitespace-nowrap";
      tabP.className = mod === 'pokembali' ? "py-2.5 px-4 text-xs font-semibold text-emerald-400 border-b-2 border-emerald-500 flex items-center gap-2 whitespace-nowrap" : "py-2.5 px-4 text-xs font-semibold text-slate-400 hover:text-white border-b-2 border-transparent flex items-center gap-2 whitespace-nowrap";

      if (mod === 'sample' && sampleData.length === 0) loadSampleData();
      if (mod === 'pokembali' && poKembaliData.length === 0) loadPoKembaliData();
    }

    function switchRole(role) {
      currentRole = role;
      const isAdmin = role === 'admin';
      document.getElementById('roleBadge').innerHTML = isAdmin 
        ? '<i class="fa-solid fa-user-shield text-orange-400"></i> <span class="text-orange-400 font-bold">Admin</span>'
        : '<i class="fa-solid fa-user-check text-emerald-400"></i> <span class="text-emerald-400 font-bold">Staff / Penerima</span>';
      document.getElementById('btnRolePenerima').className = !isAdmin ? 'px-3 py-1 rounded text-xs font-medium bg-blue-600 text-white shadow' : 'px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white transition';
      document.getElementById('btnRoleAdmin').className = isAdmin ? 'px-3 py-1 rounded text-xs font-medium bg-orange-600 text-white shadow' : 'px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white transition';
      renderTable();
    }

    function formatDateDisplay(rawDate) {
      if (!rawDate) return '-';
      const d = new Date(rawDate);
      if (isNaN(d.getTime())) return rawDate;
      return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
    }

    function formatRupiah(num) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num || 0);
    }

    // --- FETCH MODUL BERKAS ---
    function loadBerkasData() {
      fetch(`${GAS_API_URL}?action=getBerkas`)
      .then(res => res.json())
      .then(data => {
        documentsData = Array.isArray(data) ? data : [];
        renderTable();
      })
      .catch(err => console.error(err));
    }

    // --- FETCH MODUL SAMPLE ---
    function loadSampleData() {
      fetch(`${GAS_API_URL}?action=getSample`)
      .then(res => res.json())
      .then(data => {
        sampleData = Array.isArray(data) ? data : [];
        renderSampleTable();
      })
      .catch(err => console.error(err));
    }

    // --- FETCH MODUL PO KEMBALI ---
    function loadPoKembaliData() {
      fetch(`${GAS_API_URL}?action=getPoKembali`)
      .then(res => res.json())
      .then(data => {
        poKembaliData = Array.isArray(data) ? data : [];
        renderPoKembaliTable();
      })
      .catch(err => console.error(err));
    }

    // RENDER BERKAS
    function renderTable() {
      const container = document.getElementById('groupedTablesContainer');
      container.innerHTML = '';
      if (!documentsData || documentsData.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-500 py-10">Data Berkas Kosong.</p>';
        return;
      }
      document.getElementById('statTotal').innerText = documentsData.length;
      document.getElementById('statChecked').innerText = documentsData.filter(d => d.isChecked).length;
      document.getElementById('statLocked').innerText = documentsData.filter(d => d.isLocked).length;
      
      const dates = [...new Set(documentsData.map(d => formatDateDisplay(d.tanggal)))].filter(Boolean);
      document.getElementById('statDates').innerText = dates.length;

      const groups = {}; 
      documentsData.forEach(d => { 
        const tgl = formatDateDisplay(d.tanggal);
        if (!groups[tgl]) groups[tgl] = []; 
        groups[tgl].push(d); 
      });

      Object.keys(groups).forEach(date => {
        const docs = groups[date];
        let rows = docs.map((d, i) => `
          <tr class="border-b border-slate-700/50 hover:bg-slate-700/30 text-xs">
            <td class="py-3 px-4 text-center text-slate-500 font-mono">${i+1}</td>
            <td class="py-3 px-4 font-bold text-orange-400 font-mono">${d.noPo}</td>
            <td class="py-3 px-4 text-slate-200">${d.vendor}</td>
            <td class="py-3 px-4 text-emerald-400 font-mono font-bold">${formatRupiah(d.nominal)}</td>
            <td class="py-3 px-4 text-slate-400"><input type="text" value="${d.notes || ''}" class="w-full bg-slate-900/40 border border-slate-700/60 rounded px-2.5 py-1 text-xs text-slate-200 outline-none"></td>
            <td class="py-3 px-4 text-center"><input type="checkbox" ${d.isChecked ? 'checked' : ''} onchange="toggleCheck('${d.id}', this.checked)" class="accent-orange-500 w-4 h-4 cursor-pointer"></td>
            <td class="py-3 px-4 text-center font-medium">${d.isLocked ? '<span class="text-amber-400"><i class="fa-solid fa-lock"></i> Terkunci</span>' : '-'}</td>
          </tr>
        `).join('');

        container.innerHTML += `
          <div class="bg-slate-800/90 border border-slate-700 rounded-2xl overflow-hidden shadow-xl">
            <div class="bg-slate-900/90 px-5 py-3.5 flex justify-between items-center border-b border-slate-700">
              <h3 class="font-bold text-white text-base font-mono">${date} <span class="text-xs bg-slate-700/80 px-2.5 py-0.5 rounded-full font-normal ml-2">${docs.length} Berkas</span></h3>
            </div>
            <div class="overflow-x-auto"><table class="w-full text-left"><thead class="bg-slate-900/50 text-slate-400 text-[10px] uppercase"><tr><th class="py-3 px-4 text-center">NO</th><th class="py-3 px-4">NO PO</th><th class="py-3 px-4">VENDOR</th><th class="py-3 px-4">NOMINAL</th><th class="py-3 px-4">CATATAN</th><th class="py-3 px-4 text-center">CEKLIS</th><th class="py-3 px-4 text-center">STATUS</th></tr></thead><tbody class="divide-y divide-slate-700/30">${rows}</tbody></table></div>
          </div>`;
      });
    }

    // RENDER SAMPLE
    function renderSampleTable() {
      const container = document.getElementById('sampleTableContent');
      if (!sampleData || sampleData.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-500 py-6">Tidak ada data di sheet Sample.</p>';
        return;
      }
      let rows = sampleData.map((s, i) => `
        <tr class="border-b border-slate-700/50 hover:bg-slate-700/30 text-xs">
          <td class="py-3 px-4 text-center text-slate-500 font-mono">${i+1}</td>
          <td class="py-3 px-4 text-orange-400">${s.tanggal}</td>
          <td class="py-3 px-4 font-bold text-white">${s.namaBarang}</td>
          <td class="py-3 px-4 text-slate-300">${s.tujuan}</td>
          <td class="py-3 px-4 text-slate-400">${s.keterangan}</td>
        </tr>
      `).join('');
      container.innerHTML = `<table class="w-full text-left"><thead class="bg-slate-900/50 text-slate-400 text-[10px] uppercase"><tr><th class="py-3 px-4 text-center">NO</th><th class="py-3 px-4">TANGGAL</th><th class="py-3 px-4">NAMA BARANG</th><th class="py-3 px-4">TUJUAN</th><th class="py-3 px-4">KETERANGAN</th></tr></thead><tbody class="divide-y divide-slate-700/30">${rows}</tbody></table>`;
    }

    // RENDER PO KEMBALI
    function renderPoKembaliTable() {
      const container = document.getElementById('poKembaliTableContent');
      if (!poKembaliData || poKembaliData.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-500 py-6">Tidak ada data di sheet PO_Kembali.</p>';
        return;
      }
      let rows = poKembaliData.map((p, i) => `
        <tr class="border-b border-slate-700/50 hover:bg-slate-700/30 text-xs">
          <td class="py-3 px-4 text-center text-slate-500 font-mono">${i+1}</td>
          <td class="py-3 px-4 text-emerald-400 font-mono">${p.noPo}</td>
          <td class="py-3 px-4 text-slate-200">${p.namaVendor}</td>
          <td class="py-3 px-4 text-slate-300">${p.tglKirim}</td>
          <td class="py-3 px-4 text-slate-300">${p.tglKembali}</td>
          <td class="py-3 px-4 text-slate-400">${p.catatan || '-'}</td>
        </tr>
      `).join('');
      container.innerHTML = `<table class="w-full text-left"><thead class="bg-slate-900/50 text-slate-400 text-[10px] uppercase"><tr><th class="py-3 px-4 text-center">NO</th><th class="py-3 px-4">NO PO</th><th class="py-3 px-4">VENDOR</th><th class="py-3 px-4">TGL KIRIM</th><th class="py-3 px-4">TGL KEMBALI</th><th class="py-3 px-4">CATATAN</th></tr></thead><tbody class="divide-y divide-slate-700/30">${rows}</tbody></table>`;
    }

    function toggleCheck(id, isChecked) {
      const item = documentsData.find(d => d.id === id);
      if(item) item.isChecked = isChecked;
      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'updatePenerimaStatus', id: id, isCompleted: isChecked, notes: item ? item.notes : '' })
      });
    }
  </script>
</body>
</html>
