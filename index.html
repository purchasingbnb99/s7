<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPENBER - Sistem Penerimaan Berkas & Sample</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <script>
    // MASUKKAN URL WEB APP HASIL DEPLOYMENT ANDA DI SINI (BERAKHIRAN /exec)
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxf0cuja3sYJA-qdv3mxZV9PeDjZzMd4DbL8oMk82HIqC78G0RydEW_gS1qxsdtLc1p7g/exec";
  </script>

  <!-- HEADER -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-orange-500 flex items-center justify-center font-bold text-xl text-white shadow-lg">S</div>
        <div>
          <h1 class="font-bold text-lg text-orange-500 tracking-wide leading-none">SIPENBER</h1>
          <p class="text-[10px] text-slate-400 mt-1">Sistem Penerimaan Berkas & Penyerahan Sample</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <!-- BADGE AKSES -->
        <div class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700 text-xs flex items-center gap-2">
          <span class="text-slate-400">Akses:</span>
          <span id="roleBadge" class="text-emerald-400 font-bold flex items-center gap-1"><i class="fa-solid fa-user-check"></i> Staff (Hanya Lihat)</span>
        </div>

        <!-- TOMBOL SWITCH ROLE -->
        <div class="bg-slate-900 p-1 rounded-lg flex gap-1 border border-slate-700">
          <button id="btnRolePenerima" onclick="switchRole('penerima')" class="px-3 py-1 rounded text-xs font-medium bg-blue-600 text-white shadow"><i class="fa-solid fa-user"></i> Staff</button>
          <button id="btnRoleAdmin" onclick="switchRole('admin')" class="px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white transition"><i class="fa-solid fa-user-shield"></i> Admin</button>
        </div>

        <!-- INDIKATOR KONEKSI -->
        <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-700">
          <div id="dbIndicator" class="w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse"></div>
          <span id="dbText" class="text-[10px] font-bold uppercase text-slate-400 tracking-wider">CONNECTING</span>
        </div>
      </div>
    </div>

    <!-- TAB NAVIGASI -->
    <div class="bg-slate-900 border-b border-slate-700 px-4 flex gap-1">
      <button id="tabBerkas" onclick="switchModule('berkas')" class="py-2.5 px-4 text-xs font-semibold text-orange-400 border-b-2 border-orange-500 flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-folder-closed"></i> Penerimaan Berkas PO</button>
      <button id="tabSample" onclick="switchModule('sample')" class="py-2.5 px-4 text-xs font-semibold text-slate-400 hover:text-white border-b-2 border-transparent flex items-center gap-2 whitespace-nowrap"><i class="fa-solid fa-vial"></i> Penyerahan Sample</button>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col gap-6">
    
    <!-- MODUL 1: BERKAS -->
    <div id="moduleBerkasContainer" class="flex flex-col gap-6">
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl"><div><p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Total Berkas</p><h3 id="statTotal" class="text-2xl font-bold text-white mt-1">0</h3></div></div>
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl"><div><p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Diceklis</p><h3 id="statChecked" class="text-2xl font-bold text-emerald-400 mt-1">0</h3></div></div>
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl"><div><p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Terkunci</p><h3 id="statLocked" class="text-2xl font-bold text-amber-400 mt-1">0</h3></div></div>
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl"><div><p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Total Tanggal</p><h3 id="statDates" class="text-2xl font-bold text-purple-400 mt-1">0</h3></div></div>
      </div>

      <div id="groupedTablesContainer" class="flex flex-col gap-6">
        <p class="text-slate-500 text-center py-10">Memuat data dari database...</p>
      </div>
    </div>

    <!-- MODUL 2: SAMPLE -->
    <div id="moduleSampleContainer" class="hidden flex-col gap-6">
      <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl p-5">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-white text-base flex items-center gap-2"><i class="fa-solid fa-vial text-orange-400"></i> Data Penyerahan Sample</h3>
          <button id="btnAddSample" onclick="openSampleModal()" class="hidden bg-orange-600 hover:bg-orange-500 text-white text-xs font-bold px-4 py-2 rounded-lg shadow-md transition flex items-center gap-2">
            <i class="fa-solid fa-plus"></i> Tambah Sample
          </button>
        </div>
        <div id="sampleTableContent" class="overflow-x-auto">
          <p class="text-slate-500 text-center py-6">Memuat data sample...</p>
        </div>
      </div>
    </div>

  </main>

  <!-- MODAL FORM SAMPLE (KHUSUS ADMIN) -->
  <div id="sampleModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <h3 id="sampleModalTitle" class="text-lg font-bold text-white mb-4">Tambah Data Sample</h3>
      <input type="hidden" id="sampleId">
      <div class="space-y-3 text-xs">
        <div><label class="text-slate-400 block mb-1">Tanggal</label><input type="date" id="sampleTanggal" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 outline-none"></div>
        <div><label class="text-slate-400 block mb-1">Nama Barang / Sample</label><input type="text" id="sampleBarang" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 outline-none" placeholder="Masukkan nama barang"></div>
        <div><label class="text-slate-400 block mb-1">Tujuan / Penerima</label><input type="text" id="sampleTujuan" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 outline-none" placeholder="Masukkan tujuan"></div>
        <div><label class="text-slate-400 block mb-1">Keterangan</label><textarea id="sampleKeterangan" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-100 outline-none" placeholder="Keterangan tambahan..."></textarea></div>
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button onclick="closeSampleModal()" class="px-4 py-2 rounded-lg bg-slate-700 text-slate-300 text-xs font-semibold">Batal</button>
        <button onclick="saveSampleData()" class="px-4 py-2 rounded-lg bg-orange-600 text-white text-xs font-bold shadow-lg">Simpan Data</button>
      </div>
    </div>
  </div>

  <script>
    let documentsData = [];
    let sampleData = [];
    let currentRole = 'penerima'; // Default: Staff / Penerima

    window.onload = () => { loadBerkasData(); };

    function switchModule(mod) {
      document.getElementById('moduleBerkasContainer').classList.toggle('hidden', mod !== 'berkas');
      document.getElementById('moduleSampleContainer').classList.toggle('hidden', mod !== 'sample');

      document.getElementById('tabBerkas').className = mod === 'berkas' 
        ? "py-2.5 px-4 text-xs font-semibold text-orange-400 border-b-2 border-orange-500 flex items-center gap-2 whitespace-nowrap" 
        : "py-2.5 px-4 text-xs font-semibold text-slate-400 hover:text-white border-b-2 border-transparent flex items-center gap-2 whitespace-nowrap";
      
      document.getElementById('tabSample').className = mod === 'sample' 
        ? "py-2.5 px-4 text-xs font-semibold text-orange-400 border-b-2 border-orange-500 flex items-center gap-2 whitespace-nowrap" 
        : "py-2.5 px-4 text-xs font-semibold text-slate-400 hover:text-white border-b-2 border-transparent flex items-center gap-2 whitespace-nowrap";

      if (mod === 'sample') loadSampleData();
    }

    function switchRole(role) {
      currentRole = role;
      const isAdmin = role === 'admin';
      
      document.getElementById('roleBadge').innerHTML = isAdmin 
        ? '<i class="fa-solid fa-user-shield text-orange-400"></i> <span class="text-orange-400 font-bold">Admin (Full Akses)</span>'
        : '<i class="fa-solid fa-user-check text-emerald-400"></i> <span class="text-emerald-400 font-bold">Staff (Hanya Lihat)</span>';
        
      document.getElementById('btnRolePenerima').className = !isAdmin ? 'px-3 py-1 rounded text-xs font-medium bg-blue-600 text-white shadow' : 'px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white transition';
      document.getElementById('btnRoleAdmin').className = isAdmin ? 'px-3 py-1 rounded text-xs font-medium bg-orange-600 text-white shadow' : 'px-3 py-1 rounded text-xs font-medium text-slate-400 hover:text-white transition';
      
      // Tampilkan/Sembunyikan tombol aksi tambah
      document.getElementById('btnAddSample').classList.toggle('hidden', !isAdmin);

      renderTable();
      renderSampleTable();
    }

    // KONVERSI TANGGAL & PARSING UNTUK SORTING
    function parseDateObj(rawDate) {
      if (!rawDate) return new Date(0);
      if (typeof rawDate === 'string' && rawDate.includes('/')) {
        const parts = rawDate.split('/');
        return new Date(parts[2], parts[1] - 1, parts[0]);
      }
      return new Date(rawDate);
    }

    function formatDateDisplay(rawDate) {
      if (!rawDate) return '-';
      const d = parseDateObj(rawDate);
      if (isNaN(d.getTime())) return rawDate;
      return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
    }

    function formatRupiah(num) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num || 0);
    }

    // --- DATA BERKAS ---
    function loadBerkasData() {
      fetch(`${GAS_API_URL}?action=getBerkas`)
      .then(res => res.json())
      .then(data => {
        documentsData = Array.isArray(data) ? data : [];
        
        document.getElementById('dbIndicator').className = "w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]";
        document.getElementById('dbText').innerText = "CONNECTED";
        document.getElementById('dbText').className = "text-[10px] font-bold uppercase text-green-500 tracking-wider";
        
        renderTable();
      })
      .catch(err => console.error(err));
    }

    function renderTable() {
      const container = document.getElementById('groupedTablesContainer');
      container.innerHTML = '';
      
      if (!documentsData || documentsData.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-500 py-10">Data Berkas Kosong.</p>';
        return;
      }

      document.getElementById('statTotal').innerText = documentsData.length;
      document.getElementById('statChecked').innerText = documentsData.filter(d => d.isChecked).length;
      document.getElementById('statLocked').innerText = documentsData.filter(d => d.isLocked).length;

      // OLAH & URUTKAN TANGGAL TERBARU DI PADA ATAS
      const groups = {}; 
      documentsData.forEach(d => { 
        const tglFormatted = formatDateDisplay(d.tanggal);
        if (!groups[tglFormatted]) groups[tglFormatted] = []; 
        groups[tglFormatted].push(d); 
      });

      // SORTING TANGGAL (DESENDING / TERBARU KE TERLAMA)
      const sortedDates = Object.keys(groups).sort((a, b) => {
        return parseDateObj(b) - parseDateObj(a);
      });

      document.getElementById('statDates').innerText = sortedDates.length;

      sortedDates.forEach(date => {
        const docs = groups[date];
        const totalNominal = docs.reduce((acc, curr) => acc + (Number(curr.nominal) || 0), 0);
        const totalChecked = docs.filter(d => d.isChecked).length;

        let rows = docs.map((d, i) => `
          <tr class="border-b border-slate-700/50 hover:bg-slate-700/30 transition text-xs">
            <td class="py-3 px-4 text-center text-slate-500 font-mono">${i+1}</td>
            <td class="py-3 px-4 font-bold text-orange-400 font-mono">${d.noPo}</td>
            <td class="py-3 px-4 text-slate-200 font-semibold">${d.vendor}</td>
            <td class="py-3 px-4 text-emerald-400 font-mono font-bold">${formatRupiah(d.nominal)}</td>
            <td class="py-3 px-4 text-slate-400">
              <input type="text" value="${d.notes || ''}" placeholder="${d.isLocked ? 'Terkunci' : 'Catatan...'}" 
              ${currentRole !== 'admin' || d.isLocked ? 'disabled' : ''} 
              class="w-full bg-slate-900/40 border border-slate-700/60 rounded px-2.5 py-1 text-xs text-slate-200 outline-none focus:border-orange-500 disabled:opacity-60">
            </td>
            <td class="py-3 px-4 text-center">
              <input type="checkbox" ${d.isChecked ? 'checked' : ''} 
              ${currentRole !== 'admin' || d.isLocked ? 'disabled' : ''} 
              onchange="toggleCheck('${d.id}', this.checked)" 
              class="accent-orange-500 w-4 h-4 cursor-pointer disabled:cursor-not-allowed">
            </td>
            <td class="py-3 px-4 text-center font-medium">
              ${d.isLocked ? '<span class="text-amber-400 flex items-center justify-center gap-1"><i class="fa-solid fa-lock"></i> Terkunci</span>' : '<span class="text-slate-500">-</span>'}
            </td>
          </tr>
        `).join('');

        container.innerHTML += `
          <div class="bg-slate-800/90 border border-slate-700 rounded-2xl overflow-hidden shadow-xl">
            <div class="bg-slate-900/90 px-5 py-3.5 flex flex-wrap justify-between items-center border-b border-slate-700 gap-4">
              <div class="flex items-center gap-3">
                <div class="bg-blue-600/20 text-blue-400 p-2.5 rounded-xl border border-blue-500/30">
                  <i class="fa-solid fa-calendar-days text-lg"></i>
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <h3 class="font-bold text-white text-base font-mono">${date}</h3>
                    <span class="text-[11px] bg-slate-700/80 text-slate-300 px-2.5 py-0.5 rounded-full font-medium">${docs.length} Berkas</span>
                  </div>
                  <p class="text-xs text-slate-400 mt-0.5">Total Nominal: <span class="text-emerald-400 font-bold font-mono">${formatRupiah(totalNominal)}</span> | Progress: <span class="text-white font-bold">${totalChecked} dari ${docs.length} Selesai</span></p>
                </div>
              </div>

              ${currentRole === 'admin' ? `
              <div class="flex items-center gap-2">
                <button class="bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 text-emerald-400 text-xs font-semibold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                  <i class="fa-solid fa-check-double"></i> Ceklis Semua
                </button>
                <button class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-1.5 rounded-lg shadow-md transition flex items-center gap-2">
                  <i class="fa-solid fa-print"></i> Cetak Tanda Terima
                </button>
              </div>` : ''}
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left">
                <thead class="bg-slate-900/50 text-slate-400 text-[10px] uppercase font-bold border-b border-slate-700/50">
                  <tr>
                    <th class="py-3 px-4 text-center w-12">NO</th>
                    <th class="py-3 px-4">NO PO</th>
                    <th class="py-3 px-4">NAMA VENDOR / PT</th>
                    <th class="py-3 px-4">NOMINAL (RP)</th>
                    <th class="py-3 px-4">CATATAN PENERIMAAN</th>
                    <th class="py-3 px-4 text-center">CEKLIS</th>
                    <th class="py-3 px-4 text-center">AKSI / STATUS</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-700/30">${rows}</tbody>
              </table>
            </div>
          </div>`;
      });
    }

    function toggleCheck(id, isChecked) {
      if (currentRole !== 'admin') return;
      const item = documentsData.find(d => d.id === id);
      if(item) item.isChecked = isChecked;
      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'updatePenerimaStatus', id: id, isCompleted: isChecked, notes: item ? item.notes : '' })
      });
    }

    // --- DATA SAMPLE ---
    function loadSampleData() {
      fetch(`${GAS_API_URL}?action=getSample`)
      .then(res => res.json())
      .then(data => {
        sampleData = Array.isArray(data) ? data : [];
        renderSampleTable();
      })
      .catch(err => console.error(err));
    }

    function renderSampleTable() {
      const container = document.getElementById('sampleTableContent');
      if (!sampleData || sampleData.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-500 py-6">Tidak ada data di sheet Sample.</p>';
        return;
      }

      // SORTING SAMPLE TERBARU DI PADA ATAS
      sampleData.sort((a, b) => parseDateObj(b.tanggal) - parseDateObj(a.tanggal));

      let rows = sampleData.map((s, i) => `
        <tr class="border-b border-slate-700/50 hover:bg-slate-700/30 text-xs">
          <td class="py-3 px-4 text-center text-slate-500 font-mono">${i+1}</td>
          <td class="py-3 px-4 text-orange-400 font-mono">${formatDateDisplay(s.tanggal)}</td>
          <td class="py-3 px-4 font-bold text-white">${s.namaBarang}</td>
          <td class="py-3 px-4 text-slate-300">${s.tujuan}</td>
          <td class="py-3 px-4 text-slate-400">${s.keterangan}</td>
          ${currentRole === 'admin' ? `
          <td class="py-3 px-4 text-center">
            <button onclick="deleteSampleData('${s.id}')" class="text-red-400 hover:text-red-300 px-2 py-1"><i class="fa-solid fa-trash"></i></button>
          </td>` : ''}
        </tr>
      `).join('');

      container.innerHTML = `
        <table class="w-full text-left">
          <thead class="bg-slate-900/50 text-slate-400 text-[10px] uppercase font-bold border-b border-slate-700">
            <tr>
              <th class="py-3 px-4 text-center w-12">NO</th>
              <th class="py-3 px-4">TANGGAL</th>
              <th class="py-3 px-4">NAMA BARANG / SAMPLE</th>
              <th class="py-3 px-4">TUJUAN</th>
              <th class="py-3 px-4">KETERANGAN</th>
              ${currentRole === 'admin' ? '<th class="py-3 px-4 text-center">AKSI</th>' : ''}
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-700/30">${rows}</tbody>
        </table>`;
    }

    // MODAL & FUNGSI SAMPLE (KHUSUS ADMIN)
    function openSampleModal() {
      if (currentRole !== 'admin') return;
      document.getElementById('sampleId').value = '';
      document.getElementById('sampleTanggal').valueAsDate = new Date();
      document.getElementById('sampleBarang').value = '';
      document.getElementById('sampleTujuan').value = '';
      document.getElementById('sampleKeterangan').value = '';
      document.getElementById('sampleModal').classList.remove('hidden');
    }

    function closeSampleModal() {
      document.getElementById('sampleModal').classList.add('hidden');
    }

    function saveSampleData() {
      if (currentRole !== 'admin') return;
      const payload = {
        action: 'saveSample',
        id: document.getElementById('sampleId').value,
        tanggal: formatDateDisplay(document.getElementById('sampleTanggal').value),
        namaBarang: document.getElementById('sampleBarang').value,
        tujuan: document.getElementById('sampleTujuan').value,
        keterangan: document.getElementById('sampleKeterangan').value
      };

      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      }).then(() => {
        closeSampleModal();
        loadSampleData();
      });
    }

    function deleteSampleData(id) {
      if (currentRole !== 'admin') return;
      if (confirm('Hapus data sample ini?')) {
        fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'deleteSample', id: id })
        }).then(() => loadSampleData());
      }
    }
  </script>
</body>
</html>
