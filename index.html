<!DOCTYPE html>
<html lang="id">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
  
  <header class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-orange-500">SIPENBER</h1>
    <div class="flex items-center gap-2 bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
       <div id="dbIndicator" class="w-2 h-2 rounded-full bg-yellow-500"></div>
       <span class="text-[10px] font-bold uppercase">Database</span>
    </div>
  </header>

  <div id="content" class="space-y-4">
    <p class="text-slate-500">Memuat data...</p>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxf0cuja3sYJA-qdv3mxZV9PeDjZzMd4DbL8oMk82HIqC78G0RydEW_gS1qxsdtLc1p7g/exec"; 

    async function checkConnection() {
      try {
        const res = await fetch(GAS_API_URL + "?action=ping");
        if(res.ok) {
          document.getElementById('dbIndicator').className = "w-2 h-2 rounded-full bg-green-500";
          loadData();
        }
      } catch(e) {
        document.getElementById('dbIndicator').className = "w-2 h-2 rounded-full bg-red-500";
        document.getElementById('content').innerHTML = "<p class='text-red-400'>Gagal terhubung. Pastikan URL benar dan akses 'Anyone'.</p>";
      }
    }

    async function loadData() {
      const res = await fetch(GAS_API_URL + "?action=getBerkas");
      const data = await res.json();
      render(data);
    }

    function render(data) {
      const container = document.getElementById('content');
      if(data.length === 0) { container.innerHTML = "<p class='text-slate-500'>Tidak ada data.</p>"; return; }
      
      let html = `<table class="w-full bg-slate-800 rounded-xl overflow-hidden text-sm">
        <thead class="bg-slate-700 text-xs uppercase"><tr><th class="p-3">PO</th><th class="p-3">Vendor</th><th class="p-3">Nominal</th></tr></thead>
        <tbody>`;
      data.forEach(d => {
        html += `<tr class="border-b border-slate-700">
          <td class="p-3 font-bold text-orange-400">${d.noPo}</td>
          <td class="p-3">${d.vendor}</td>
          <td class="p-3 text-emerald-400">${d.nominal}</td>
        </tr>`;
      });
      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    window.onload = checkConnection;
  </script>
</body>
</html>
